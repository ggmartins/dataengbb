{{/*
Place in helm/cluster-level-resources/templates/alb-controller-mtls.yaml.

This alternative keeps the existing Argo CD Application/release name and adds
a dedicated, HTTPS-only Ingress whose ALB verifies client certificates.
Disable alb-controller.enabled to avoid rendering the Application twice.
The controller settings still come from the existing alb-controller values.

Merge this example into cluster-level-resources values (replace placeholders):

cluster: my-eks-cluster
accountNumber: "123456789012"
alb-controller:
  enabled: false
  targetRevision: "1.13.4"
  hostNetworkEnabled: false
  configuration:
    enabled: false
alb-controller-mtls:
  enabled: true
  ingress:
    name: revproxy-mtls
    namespace: gen3
    hostname: mtls.example.org
    certificateArn: arn:aws:acm:us-east-1:123456789012:certificate/REPLACE_ME
    trustStore: arn:aws:elasticloadbalancing:us-east-1:123456789012:truststore/REPLACE_ME/REPLACE_ME
    scheme: internet-facing
    targetType: instance
    serviceName: revproxy-service
    servicePort: 80
    sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06

Prerequisites:
- The backend namespace and Service already exist. Ingress and Service must
  share a namespace. instance targets require a NodePort/LoadBalancer Service;
  use ip targets when the pod networking supports ALB-to-pod connectivity.
- Create an ALB trust store containing the trusted client CA bundle first.
  The trust store and ACM server certificate must be in the ALB's AWS region.
- The controller IAM role needs the permissions from its matching upstream
  IAM policy, including DescribeTrustStores and listener create/modify
  permissions. Provisioning the trust store itself is a separate IAM concern.
- Point the new hostname at the generated ALB. Clients need a certificate
  issued by a CA in the trust store, plus its corresponding private key.
- Existing revproxy ingresses remain independent. This creates a separate ALB
  endpoint and does not retrofit mTLS onto an existing public endpoint.
  For an existing Gen3 endpoint, instead put the mutual-authentication
  annotation on its revproxy Ingress via revproxy.ingress.annotations.

mTLS applies to the entire HTTPS listener, including every path on it.
TLS terminates at the ALB; the backend connection here uses HTTP, as in the
current Gen3 revproxy ingress. This does not configure outbound mTLS to RAS.
The original external controller valueFiles branch is preserved below;
mTLS settings belong to this Ingress, not that controller values file.
*/}}
{{- $alb := index .Values "alb-controller" | default dict -}}
{{- $mtls := index .Values "alb-controller-mtls" | default dict -}}
{{- if $mtls.enabled -}}
{{- if $alb.enabled -}}
{{- fail "Set alb-controller.enabled=false when alb-controller-mtls.enabled=true; both templates manage the same alb-controller Application/release." -}}
{{- end -}}
{{- $configuration := $alb.configuration | default dict -}}
{{- $valuesRepo := .Values.configuration | default dict -}}
{{- $ingress := $mtls.ingress | default dict -}}
{{- $clusterName := required "Set eksClusterName or cluster" (.Values.eksClusterName | default .Values.cluster) -}}
{{- $certificateArn := required "Set alb-controller-mtls.ingress.certificateArn to the ACM server certificate ARN" $ingress.certificateArn -}}
{{- $trustStore := required "Set alb-controller-mtls.ingress.trustStore to an existing ALB trust store ARN or name" $ingress.trustStore -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alb-controller
  namespace: argocd
spec:
  project: default
  sources:
    - chart: aws-load-balancer-controller
      repoURL: https://aws.github.io/eks-charts
      targetRevision: {{ required "Set alb-controller.targetRevision to the AWS controller Helm chart version" $alb.targetRevision | quote }}
      helm:
        releaseName: alb-controller
        {{- if $configuration.enabled }}
        valueFiles:
          - {{ printf "$values/%s/cluster-values/alb-controller.yaml" (required "Set cluster for the external controller values path" .Values.cluster) | quote }}
    - repoURL: {{ required "Set configuration.configurationRepo" $valuesRepo.configurationRepo | quote }}
      targetRevision: {{ required "Set configuration.configurationRevision" $valuesRepo.configurationRevision | quote }}
      ref: values
        {{- else }}
        values: |
          clusterName: {{ $clusterName | quote }}
          serviceAccount:
            create: true
            annotations:
              eks.amazonaws.com/role-arn: {{ printf "arn:aws:iam::%v:role/gen3_service/%s--default--ingress" (required "Set accountNumber for the controller IAM role" .Values.accountNumber) $clusterName | quote }}
            name: aws-load-balancer-controller
          metricsBindAddr: "0.0.0.0:8081"
          hostNetwork: {{ $alb.hostNetworkEnabled | default false }}
        {{- end }}
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    automated:
      selfHeal: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ingress.name | default "revproxy-mtls" | quote }}
  namespace: {{ required "Set alb-controller-mtls.ingress.namespace to the backend Service namespace" $ingress.namespace | quote }}
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ $ingress.scheme | default "internet-facing" | quote }}
    alb.ingress.kubernetes.io/target-type: {{ $ingress.targetType | default "instance" | quote }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ $certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: {{ $ingress.sslPolicy | default "ELBSecurityPolicy-TLS13-1-2-2021-06" | quote }}
    alb.ingress.kubernetes.io/mutual-authentication: {{ list (dict "port" 443 "mode" "verify" "trustStore" $trustStore "ignoreClientCertificateExpiry" false) | toJson | quote }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "Set alb-controller-mtls.ingress.hostname" $ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $ingress.serviceName | default "revproxy-service" | quote }}
                port:
                  number: {{ $ingress.servicePort | default 80 }}
{{- end }}
